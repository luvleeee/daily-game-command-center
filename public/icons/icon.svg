<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1036"/>
      <stop offset="1" stop-color="#07070d"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e879f9"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx=".75" cy=".15" r=".8">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- die -->
  <g transform="translate(256 256) rotate(-12)">
    <rect x="-128" y="-128" width="256" height="256" rx="64" fill="url(#fg)"/>
    <rect x="-128" y="-128" width="256" height="256" rx="64" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="6"/>
    <g fill="#fff">
      <circle cx="-58" cy="-58" r="24"/>
      <circle cx="0" cy="0" r="24"/>
      <circle cx="58" cy="58" r="24"/>
      <circle cx="58" cy="-58" r="24"/>
      <circle cx="-58" cy="58" r="24"/>
    </g>
  </g>
</svg>
